name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -- --prod
      - run: npm run pack
      - run: npm run build:firefox -- --prod --only=ext
      - run: npm run pack:firefox
      # Existing UI innerHTML warnings are reported; manifest/validation errors fail CI.
      - run: npx --yes web-ext@10.8.0 lint --source-dir dist-firefox
      - uses: actions/upload-artifact@v4
        with: { name: legion-3d-extension, path: dist }
      - uses: actions/upload-artifact@v4
        with: { name: legion-3d-firefox-extension, path: dist-firefox }
  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: sudo apt-get install -y libgl1-mesa-dri libglx-mesa0
      - name: Install geckodriver
        run: |
          curl -fsSL --retry 3 https://github.com/mozilla/geckodriver/releases/download/v0.37.0/geckodriver-v0.37.0-linux64.tar.gz | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - run: npm run build:firefox -- --prod
      - run: npm run pack:firefox
      - run: npm run build:firefox -- --only=dev
      # Firefox needs an X display to create a software WebGL context on Linux.
      - run: xvfb-run -a npm run e2e:firefox
        env: { LIBGL_ALWAYS_SOFTWARE: 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: legion-3d-firefox-test, path: e2e/.artifacts/firefox }
