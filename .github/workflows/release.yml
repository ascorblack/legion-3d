name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build.mjs --prod
      - name: Check version matches tag
        run: |
          v=$(node -p "require('./dist/manifest.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "manifest $v != tag ${GITHUB_REF_NAME}"; exit 1; }
      - run: node scripts/pack.mjs
      - run: npm run build:firefox -- --prod --only=ext
      # Firefox only installs Mozilla-signed add-ons permanently. Sign the build through AMO's self-distribution
      # (unlisted) channel; without the AMO secrets no Firefox file is attached at all (an unsigned one would
      # disappear after a browser restart and confuse players).
      - name: Sign Firefox build (AMO unlisted)
        id: firefox
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [[ -z "$AMO_JWT_ISSUER" || -z "$AMO_JWT_SECRET" ]]; then
            echo 'AMO secrets missing; no Firefox file in this release.'; exit 0
          fi
          set -euo pipefail
          npx --yes web-ext@10.8.0 sign --source-dir dist-firefox --artifacts-dir amo --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --approval-timeout 1800000
          xpi="legion-3d-${GITHUB_REF_NAME#v}-firefox.xpi"
          mv amo/*.xpi "$xpi"
          echo "xpi=$xpi" >> "$GITHUB_OUTPUT"
      - name: Release notes with screenshots
        run: node scripts/release-notes.mjs "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" .github/RELEASE_NOTES.md release-notes.md
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}', XPI: '${{ steps.firefox.outputs.xpi }}' }
        # Only user files go to GitHub: the Chrome zip and the signed Firefox .xpi. Store payloads stay separate.
        run: |
          files=("legion-3d-${GITHUB_REF_NAME#v}.zip")
          [[ -n "$XPI" ]] && files+=("$XPI")
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            && gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber \
            || gh release create "${GITHUB_REF_NAME}" "${files[@]}" --title "Legion 3D ${GITHUB_REF_NAME}" --notes-file release-notes.md
      # Firefox catalogue (addons.mozilla.org, listed): a SEPARATE add-on (legion-3d-amo@ascorblack, see scripts/pack.mjs)
      # built from the store payload (no GitHub update check — AMO updates it). Submitted for Mozilla's review with the
      # source archive (the bundle is minified); it appears on AMO and auto-updates after their review. Skipped without
      # the AMO secrets; a failure here never blocks the GitHub release above.
      - name: Submit Firefox catalogue update (AMO listed)
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [[ -z "$AMO_JWT_ISSUER" || -z "$AMO_JWT_SECRET" ]]; then echo 'AMO secrets missing; skipping.'; exit 0; fi
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          node scripts/pack.mjs --browser=firefox
          rm -rf amo-listed && mkdir amo-listed && unzip -q "legion-3d-$v-firefox-store.zip" -d amo-listed
          git archive --format=zip -o "legion-3d-$v-source.zip" HEAD
          npx --yes web-ext@10.8.0 sign --source-dir amo-listed --artifacts-dir amo-listed-out --channel listed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --amo-metadata store/amo-metadata.json --upload-source-code "legion-3d-$v-source.zip" --approval-timeout 0
      # First submission and store listing are created manually. These steps update an existing item only.
      - name: Upload and publish Chrome Web Store update (optional)
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [[ -z "$CWS_EXTENSION_ID" || -z "$CWS_CLIENT_ID" || -z "$CWS_CLIENT_SECRET" || -z "$CWS_REFRESH_TOKEN" ]]; then
            echo 'Chrome Web Store secrets missing; skipping.'; exit 0
          fi
          set -euo pipefail
          file="legion-3d-${GITHUB_REF_NAME#v}-store.zip"
          token=$(curl -fsS --retry 2 https://oauth2.googleapis.com/token \
            -d grant_type=refresh_token --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" | jq -er '.access_token')
          base="https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID"
          upload=$(curl -fsS --retry 2 -X PUT -H "Authorization: Bearer $token" -H 'x-goog-api-version: 2' \
            -T "$file" "$base")
          echo "$upload" | jq -e '.uploadState == "SUCCESS"' >/dev/null
          publish=$(curl -fsS --retry 2 -X POST -H "Authorization: Bearer $token" -H 'x-goog-api-version: 2' \
            "$base/publish?publishTarget=default")
          echo "$publish" | jq -e '.status | index("OK") or index("PUBLISHED_WITH_FRICTION")' >/dev/null
          echo 'Chrome Web Store update submitted for review.'
      - name: Upload and submit Edge Add-ons update (optional)
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          if [[ -z "$EDGE_PRODUCT_ID" || -z "$EDGE_CLIENT_ID" || -z "$EDGE_API_KEY" ]]; then
            echo 'Edge Add-ons secrets missing; skipping.'; exit 0
          fi
          set -euo pipefail
          file="legion-3d-${GITHUB_REF_NAME#v}-store.zip"
          base="https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions"
          headers=(-H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID")
          # Edge responds 202 while package validation runs. Never submit a draft until validation succeeds.
          operation=$(curl -fsS -D edge-headers -o /dev/null -X POST "${headers[@]}" \
            -H 'Content-Type: application/zip' -T "$file" "$base/draft/package"; \
            awk 'tolower($1)=="location:" {gsub("\r", "", $2); print $2}' edge-headers | tail -1)
          [[ -n "$operation" ]] || { echo 'Edge upload did not return an operation ID'; exit 1; }
          succeeded=false
          for i in {1..20}; do
            status=$(curl -fsS "${headers[@]}" "$base/draft/package/operations/$operation" | jq -r '.status')
            if [[ "$status" == Succeeded ]]; then succeeded=true; break; fi
            if [[ "$status" == Failed ]]; then echo 'Edge package validation failed'; exit 1; fi
            sleep 15
          done
          [[ "$succeeded" == true ]] || { echo 'Edge validation timeout'; exit 1; }
          curl -fsS -o /dev/null -X POST "${headers[@]}" -H 'Content-Type: text/plain' \
            --data "Legion 3D ${GITHUB_REF_NAME}" "$base"
          echo 'Edge Add-ons update submitted for review.'
